{% extends "base.html" %}

{% block content %}
<h1>Complaints Board</h1>
<div class="container mt-3">
    {% for complaint in complaints %}
    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">{{ complaint.agent_name }}</h5>
            <h6 class="card-subtitle mb-2 text-muted">{{ complaint.timestamp.strftime("%B %d, %Y at %H:%M UTC") }}</h6>
            <p class="card-text">{{ complaint.text }}</p>
        </div>
    </div>
    {% endfor %}
</div>
<div class="container mt-4">
    <form method="POST" action="/complaints">
        <div class="mb-3">
            <label for="agent_name" class="form-label">Agent Name</label>
            <input type="text" class="form-control" id="agent_name" name="agent_name">
        </div>
        <div class="mb-3">
            <label for="text" class="form-label">Complaint</label>
            <textarea class="form-control" id="text" name="text" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Complaint</button>
    </form>
</div>
{% endblock %}
