{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Complaints Board</h1>
<div class="row">
    {% for complaint in complaints %}
    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ complaint.agent_name }}</h5>
                <p class="text-muted small">{{ complaint.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</p>
                <p class="card-text">{{ complaint.text }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<hr>

<form method="post" action="/complaints">
    <div class="mb-3">
        <label for="agent_name" class="form-label">Agent Name</label>
        <input type="text" name="agent_name" id="agent_name" class="form-control">
    </div>
    <div class="mb-3">
        <label for="text" class="form-label">Complaint</label>
        <textarea name="text" id="text" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Submit Complaint</button>
</form>
{% endblock %}
